openapi: 3.1.0
info:
  title: SENTINEL Security Contract
  version: 0.2.0
  description: Shared contract for monitoring, explainable detection, adaptive defense, continuity verification, recovery, and audit evidence.
servers:
  - url: http://127.0.0.1:8000
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          description: Security core is available.
  /api/v1/gateway/evaluate:
    post:
      operationId: evaluateRequest
      summary: Evaluate a protected request before forwarding it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestEvent"
      responses:
        "200":
          description: Policy decision. `response_status` describes the simulated gateway outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewayDecision"
  /api/v1/events/ingest:
    post:
      operationId: ingestEvent
      parameters:
        - in: header
          name: X-Sentinel-Ingestion-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestEvent" }
      responses:
        "200":
          description: Authenticated event evaluation result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayDecision" }
        "401": { description: Valid ingestion token required. }
  /api/v1/incidents:
    get:
      operationId: listIncidents
      responses:
        "200":
          description: Retained incident evidence, newest first.
  /api/v1/incidents/{incident_id}:
    patch:
      operationId: updateIncident
      parameters:
        - { in: path, name: incident_id, required: true, schema: { type: string } }
        - { in: header, name: X-Operator-Role, required: true, schema: { type: string, enum: [operator, admin] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentUpdate" }
      responses:
        "200":
          description: Updated incident status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "403": { description: Operator or admin role required. }
        "404": { description: Incident not found. }
  /api/v1/incidents/{incident_id}/evidence:
    get:
      operationId: getIncidentEvidence
      parameters:
        - { in: path, name: incident_id, required: true, schema: { type: string } }
      responses:
        "200": { description: Persisted request, containment, and continuity evidence correlated to the incident. }
  /api/v1/activity:
    get:
      operationId: listActivity
      responses:
        "200":
          description: Retained request events, newest first.
  /api/v1/dashboard:
    get:
      operationId: getDashboard
      responses:
        "200": { description: Live aggregate defense posture and recent evidence. }
  /api/v1/detections:
    get:
      operationId: listDetections
      responses:
        "200": { description: Explainable risk assessments, newest first. }
  /api/v1/audit:
    get:
      operationId: listAudit
      responses:
        "200": { description: Append-only security and administrative audit history. }
  /api/v1/firewall/rules:
    get:
      operationId: listFirewallRules
      responses:
        "200": { description: Active and historical scoped gateway rules. }
    post:
      operationId: createFirewallRule
      parameters:
        - in: header
          name: X-Operator-Role
          required: true
          schema: { type: string, enum: [operator, admin] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleCreate" }
      responses:
        "200":
          description: Enforced rule or automatically rolled-back rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FirewallRule" }
        "422": { description: Unsafe, duplicate, or invalid rule. }
  /api/v1/firewall/rules/{rule_id}:
    delete:
      operationId: removeFirewallRule
      parameters:
        - { in: path, name: rule_id, required: true, schema: { type: string } }
        - { in: header, name: X-Operator-Role, required: true, schema: { type: string, enum: [operator, admin] } }
      responses:
        "200":
          description: Rule marked removed and audited.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FirewallRule" }
        "404": { description: Firewall rule not found. }
  /api/v1/sessions:
    get:
      operationId: listSessions
      responses:
        "200": { description: Known operator sessions and enforcement status. }
  /api/v1/sessions/{session_id}/revoke:
    post:
      operationId: revokeSession
      parameters:
        - { in: path, name: session_id, required: true, schema: { type: string } }
        - { in: header, name: X-Operator-Role, required: true, schema: { type: string, enum: [operator, admin] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionControl" }
      responses:
        "200":
          description: Session revoked and audited.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionProfile" }
  /api/v1/sessions/{session_id}/restore:
    post:
      operationId: restoreSession
      parameters:
        - { in: path, name: session_id, required: true, schema: { type: string } }
        - { in: header, name: X-Operator-Role, required: true, schema: { type: string, enum: [operator, admin] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SessionControl" }
      responses:
        "200":
          description: Session restored and audited.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionProfile" }
  /api/v1/services:
    get:
      operationId: listProtectedServices
      responses:
        "200": { description: Protected infrastructure and current service health. }
  /api/v1/health-checks:
    get:
      operationId: listHealthChecks
      responses:
        "200": { description: Continuity verification history. }
  /api/v1/health-checks/run:
    post:
      operationId: runHealthCheck
      parameters:
        - { in: header, name: X-Operator-Role, required: true, schema: { type: string, enum: [operator, admin] } }
      responses:
        "200":
          description: Persisted continuity verification result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthCheck" }
  /api/v1/policies:
    get:
      operationId: listPolicies
      responses:
        "200": { description: Detection and response authorization policies. }
  /api/v1/policies/{policy_id}:
    patch:
      operationId: updatePolicy
      parameters:
        - { in: path, name: policy_id, required: true, schema: { type: string } }
        - { in: header, name: X-Operator-Role, required: true, schema: { type: string, enum: [operator, admin] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyUpdate" }
      responses:
        "200":
          description: Updated detection and response policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Policy" }
        "422": { description: Thresholds are invalid or out of order. }
  /api/v1/simulations/compromised-session:
    post:
      operationId: runCompromisedSessionSimulation
      parameters:
        - { in: header, name: X-Operator-Role, required: true, schema: { type: string, enum: [operator, admin] } }
      responses:
        "200":
          description: Completed attack, containment, and continuity-verification result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationResult"
  /api/v1/simulations/rollback:
    post:
      operationId: runRollbackSimulation
      parameters:
        - { in: header, name: X-Operator-Role, required: true, schema: { type: string, enum: [operator, admin] } }
      responses:
        "200":
          description: An overrestrictive test rule rolled back after failed continuity verification.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FirewallRule" }
  /api/v1/jury/status:
    get:
      operationId: juryStatus
      summary: Read the latest shared jury simulation state.
      responses:
        "200":
          description: Current public demonstration status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JuryStatus" }
  /api/v1/jury/attacks:
    post:
      operationId: triggerJuryAttack
      summary: Launch one allowlisted synthetic attack simulation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JuryAttackRequest" }
      responses:
        "200":
          description: Containment result visible to both jury and operator screens.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JuryRun" }
        "422": { description: Scenario is not one of the allowlisted simulations. }
        "429": { description: Another simulation was submitted too recently. }
  /api/v1/jury/runs/{run_id}:
    get:
      operationId: getJuryRun
      summary: Recover a jury simulation by its idempotency identifier.
      parameters:
        - { in: path, name: run_id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Persisted simulation lifecycle and presentation result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JuryRun" }
        "404": { description: Jury simulation was not found. }
  /api/v1/jury/reset:
    post:
      operationId: resetJuryDemo
      parameters:
        - { in: header, name: X-Operator-Role, required: true, schema: { type: string, enum: [operator, admin] } }
      responses:
        "200":
          description: Cleared shared demo state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JuryStatus" }
  /api/v1/facility/snapshot:
    get:
      operationId: getFacilitySnapshot
      summary: Read the authoritative water-facility state and topology.
      responses:
        "200":
          description: Current facility snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FacilitySnapshot" }
  /api/v1/facility/assets/{asset_id}/commands:
    post:
      operationId: executeFacilityCommand
      summary: Evaluate and conditionally apply an operator command.
      parameters:
        - in: path
          name: asset_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FacilityCommandRequest" }
      responses:
        "200":
          description: SENTINEL decision and resulting authoritative asset state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FacilityCommandResult" }
        "404": { description: Unknown facility asset. }
        "422": { description: Unsupported command or invalid command value. }
  /api/v1/facility/reset:
    post:
      operationId: resetFacility
      parameters:
        - { in: header, name: X-Operator-Role, required: true, schema: { type: string, enum: [operator, admin] } }
      responses:
        "200":
          description: Deterministic baseline facility snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FacilitySnapshot" }
  /api/v1/facility/scenarios/compromised-operator:
    post:
      operationId: runCompromisedOperatorScenario
      parameters:
        - { in: header, name: X-Operator-Role, required: true, schema: { type: string, enum: [operator, admin] } }
      responses:
        "200":
          description: Blocked attack plus successful legitimate continuity command.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FacilityScenarioResult" }
components:
  schemas:
    IncidentUpdate:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [active, contained, investigating, resolved] }
        resolution: { type: [string, "null"], maxLength: 1000 }
    RuleCreate:
      type: object
      additionalProperties: false
      required: [target_type, target_value, justification]
      properties:
        target_type: { type: string, enum: [ip, endpoint, ip_endpoint] }
        target_value: { type: string, minLength: 1, maxLength: 240 }
        action: { type: string, const: block, default: block }
        justification: { type: string, minLength: 8, maxLength: 500 }
        duration_seconds: { type: integer, minimum: 30, maximum: 86400, default: 900 }
        incident_id: { type: [string, "null"] }
        simulate_continuity_failure: { type: boolean, default: false }
    FirewallRule:
      type: object
      required: [rule_id, target_type, target_value, action, justification, created_at, expires_at, status, created_by]
      properties:
        rule_id: { type: string }
        target_type: { type: string, enum: [ip, endpoint, ip_endpoint] }
        target_value: { type: string }
        action: { type: string, const: block }
        justification: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        status: { type: string, enum: [active, expired, removed, rolled_back] }
        incident_id: { type: [string, "null"] }
        created_by: { type: string }
    SessionControl:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 8, maxLength: 500 }
    SessionProfile:
      type: object
      required: [session_id, user_id, trusted_source_ip, trusted_device_id, status]
      properties:
        session_id: { type: string }
        user_id: { type: string }
        trusted_source_ip: { type: string }
        trusted_device_id: { type: string }
        status: { type: string, enum: [active, restricted, revoked] }
    HealthCheck:
      type: object
      required: [check_id, service_id, checked_at, status, response_time_ms, transaction_succeeded, detail]
      properties:
        check_id: { type: string }
        service_id: { type: string }
        checked_at: { type: string, format: date-time }
        status: { type: string, enum: [healthy, degraded, unavailable] }
        response_time_ms: { type: integer, minimum: 0 }
        transaction_succeeded: { type: boolean }
        rule_id: { type: [string, "null"] }
        detail: { type: string }
    PolicyUpdate:
      type: object
      additionalProperties: false
      properties:
        enabled: { type: [boolean, "null"] }
        moderate_threshold: { type: [integer, "null"], minimum: 0, maximum: 100 }
        high_threshold: { type: [integer, "null"], minimum: 0, maximum: 100 }
        critical_threshold: { type: [integer, "null"], minimum: 0, maximum: 100 }
        automatic_containment: { type: [boolean, "null"] }
        require_corroboration: { type: [boolean, "null"] }
    Policy:
      type: object
      required: [policy_id, name, description, enabled, moderate_threshold, high_threshold, critical_threshold, automatic_containment, require_corroboration, updated_at]
      properties:
        policy_id: { type: string }
        name: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        moderate_threshold: { type: integer, minimum: 0, maximum: 100 }
        high_threshold: { type: integer, minimum: 0, maximum: 100 }
        critical_threshold: { type: integer, minimum: 0, maximum: 100 }
        automatic_containment: { type: boolean }
        require_corroboration: { type: boolean }
        updated_at: { type: string, format: date-time }
    RequestEvent:
      type: object
      additionalProperties: false
      required: [session_id, user_id, service_id, method, path, source_ip, device_id]
      properties:
        event_id: { type: string }
        timestamp: { type: string, format: date-time }
        session_id: { type: string }
        user_id: { type: string }
        service_id: { type: string }
        method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
        path: { type: string }
        source_ip: { type: string }
        device_id: { type: string }
        authenticated: { type: boolean, default: true }
        attributes: { type: object, additionalProperties: true }
    RiskSignal:
      type: object
      required: [code, label, score, evidence]
      properties:
        code: { type: string }
        label: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        evidence: { type: string }
    RiskAssessment:
      type: object
      required: [assessment_id, event_id, created_at, risk_score, level, signals, recommendation]
      properties:
        assessment_id: { type: string }
        event_id: { type: string }
        created_at: { type: string, format: date-time }
        risk_score: { type: integer, minimum: 0, maximum: 100 }
        level: { type: string, enum: [low, medium, high, critical] }
        signals:
          type: array
          items: { $ref: "#/components/schemas/RiskSignal" }
        recommendation: { type: string }
    Incident:
      type: object
      required: [incident_id, created_at, title, service_id, session_id, status, risk, summary]
      properties:
        incident_id: { type: string }
        created_at: { type: string, format: date-time }
        title: { type: string }
        service_id: { type: string }
        session_id: { type: string }
        status: { type: string, enum: [active, contained, investigating, resolved] }
        risk: { $ref: "#/components/schemas/RiskAssessment" }
        summary: { type: string }
    ContainmentAction:
      type: object
      required: [action_id, created_at, incident_id, session_id, action, policy, status, reversible]
      properties:
        action_id: { type: string }
        created_at: { type: string, format: date-time }
        incident_id: { type: string }
        session_id: { type: string }
        action: { type: string, enum: [restrict_session] }
        policy: { type: string }
        status: { type: string, enum: [enforced] }
        reversible: { type: boolean }
    GatewayDecision:
      type: object
      required: [event_id, allowed, response_status, reason]
      properties:
        event_id: { type: string }
        allowed: { type: boolean }
        response_status: { type: integer }
        reason: { type: string }
        assessment: { oneOf: [{ $ref: "#/components/schemas/RiskAssessment" }, { type: "null" }] }
        incident: { oneOf: [{ $ref: "#/components/schemas/Incident" }, { type: "null" }] }
        containment: { oneOf: [{ $ref: "#/components/schemas/ContainmentAction" }, { type: "null" }] }
    SimulationResult:
      type: object
      required: [scenario, completed_at, attacker_session_id, legitimate_session_id, attacker_response_status, legitimate_response_status, continuity_verified, incident, containment, steps]
      properties:
        scenario: { type: string }
        completed_at: { type: string, format: date-time }
        attacker_session_id: { type: string }
        legitimate_session_id: { type: string }
        attacker_response_status: { type: integer, const: 403 }
        legitimate_response_status: { type: integer, const: 200 }
        continuity_verified: { type: boolean }
        incident: { $ref: "#/components/schemas/Incident" }
        containment: { $ref: "#/components/schemas/ContainmentAction" }
        steps:
          type: array
          items:
            type: object
            required: [sequence, event, outcome]
            properties:
              sequence: { type: integer }
              event: { type: string }
              outcome: { type: string }
    FacilityAsset:
      type: object
      additionalProperties: false
      required: [id, name, asset_type, status, security_status, position, metrics, supported_commands]
      properties:
        id: { type: string }
        name: { type: string }
        asset_type: { type: string }
        status: { type: string }
        security_status: { type: string }
        position:
          type: array
          minItems: 3
          maxItems: 3
          items: { type: number }
        metrics: { type: object, additionalProperties: true }
        supported_commands:
          type: array
          items: { type: string }
    FacilityConnection:
      type: object
      additionalProperties: false
      required: [id, source, target, flow_m3s, active]
      properties:
        id: { type: string }
        source: { type: string }
        target: { type: string }
        flow_m3s: { type: number, minimum: 0 }
        active: { type: boolean }
    FacilitySnapshot:
      type: object
      additionalProperties: false
      required: [revision, generated_at, assets, connections]
      properties:
        revision: { type: integer, minimum: 1 }
        generated_at: { type: string, format: date-time }
        assets:
          type: array
          items: { $ref: "#/components/schemas/FacilityAsset" }
        connections:
          type: array
          items: { $ref: "#/components/schemas/FacilityConnection" }
    OperatorSession:
      type: object
      additionalProperties: false
      required: [session_id, user_id, source_ip, device_id]
      properties:
        session_id: { type: string }
        user_id: { type: string }
        source_ip: { type: string }
        device_id: { type: string }
    AssetCommand:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [open, close, start, stop, set_mode, set_target, isolate] }
        value: {}
    FacilityCommandRequest:
      type: object
      additionalProperties: false
      required: [command, session]
      properties:
        command: { $ref: "#/components/schemas/AssetCommand" }
        session: { $ref: "#/components/schemas/OperatorSession" }
    FacilityCommandResult:
      type: object
      additionalProperties: false
      required: [applied, asset, decision]
      properties:
        applied: { type: boolean }
        asset: { $ref: "#/components/schemas/FacilityAsset" }
        decision: { $ref: "#/components/schemas/GatewayDecision" }
    FacilityScenarioResult:
      type: object
      additionalProperties: false
      required: [scenario, attack, legitimate, continuity_verified, steps]
      properties:
        scenario: { type: string, const: compromised-operator }
        attack: { $ref: "#/components/schemas/FacilityCommandResult" }
        legitimate: { $ref: "#/components/schemas/FacilityCommandResult" }
        continuity_verified: { type: boolean }
        steps:
          type: array
          items:
            type: object
            required: [sequence, event, outcome]
            properties:
              sequence: { type: integer }
              event: { type: string }
              outcome: { type: string }
    JuryAttackRequest:
      type: object
      additionalProperties: false
      required: [scenario]
      properties:
        scenario: { type: string, enum: [sensor-spoofing, command-injection, compromised-operator] }
        request_id: { type: string, minLength: 8, maxLength: 96, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]+$" }
    JuryRun:
      type: object
      additionalProperties: false
      required: [run_id, scenario, status, created_at, completed_at, affected_asset_ids, risk_score, continuity_verified, defense_actions, steps]
      properties:
        run_id: { type: string }
        scenario: { type: string, enum: [sensor-spoofing, command-injection, compromised-operator] }
        status: { type: string, enum: [running, contained, failed] }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        affected_asset_ids:
          type: array
          items: { type: string }
        risk_score: { type: integer, minimum: 0, maximum: 100 }
        continuity_verified: { type: boolean }
        defense_actions:
          type: array
          items: { type: string }
        steps:
          type: array
          items:
            type: object
            required: [sequence, event, outcome]
            properties:
              sequence: { type: integer }
              event: { type: string }
              outcome: { type: string }
    JuryStatus:
      type: object
      additionalProperties: false
      required: [active_run]
      properties:
        active_run:
          oneOf:
            - { $ref: "#/components/schemas/JuryRun" }
            - { type: "null" }
